<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Семицветик</title>
    <script>
      // GitHub Pages SPA fallback: /nko-seven-color/foo → /nko-seven-color/?p=/foo
      sessionStorage.setItem(
        'gh-pages-redirect',
        location.pathname + location.search + location.hash,
      )
      location.replace('/nko-seven-color/')
    </script>
  </head>
  <body></body>
</html>
